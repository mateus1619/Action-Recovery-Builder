name: Build Android ROM

on:
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up environment
        run: |
          sudo apt update && sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop openjdk-11-jdk pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Create workspace directory
        run: |
          mkdir -p workspace

      - name: Initialize repo for LineageOS
        run: |
          MANIFEST_BRANCH="17.1"
          if [[ "$MANIFEST_BRANCH" =~ ^[0-9]+\.[0-9]+$ ]]; then
            repo init --depth=1 -u https://github.com/LineageOS/android.git -b lineage-${MANIFEST_BRANCH}
          else
            echo "Invalid MANIFEST_BRANCH provided" >&2
            exit 1
          fi
        working-directory: workspace

      - name: Sync source for LineageOS
        run: repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        working-directory: workspace

      - name: Clone device, kernel, and vendor
        run: |
          DEVICE_TREE_URL="https://github.com/TeamWin/android_device_motorola_pettyl"
          KERNEL_URL="https://github.com/MotorolaMobilityLLC/kernel-msm"
          VENDOR_URL="https://github.com/AndroidBlobs/vendor_motorola_pettyl"

          DEVICE_TREE_BRANCH="android-8.1"
          KERNEL_BRANCH="android-10-release-qpzs30.30-q3-38-69-10"
          VENDOR_BRANCH="8-OPGS28.54-53-8-7-0814d-release-keys"

          # Clonar repositórios com os branches específicos
          git clone -b $DEVICE_TREE_BRANCH $DEVICE_TREE_URL workspace/device/motorola/pettyl
          git clone -b $KERNEL_BRANCH $KERNEL_URL workspace/kernel/motorola/pettyl
          git clone -b $VENDOR_BRANCH $VENDOR_URL workspace/vendor/motorola/pettyl
        working-directory: workspace

      - name: Sync ROM dependencies
        run: |
          source build/envsetup.sh
          breakfast pettyl
        working-directory: workspace

      - name: Build ROM
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch lineage_pettyl-userdebug
          make bacon -j$(nproc --all)
        working-directory: workspace

      - name: Upload to Release
        uses: actions/upload-artifact@v3
        with:
          name: ROM-pettyl-17.1
          path: workspace/out/target/product/pettyl/*.zip
