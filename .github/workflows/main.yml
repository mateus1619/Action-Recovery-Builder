name: Build Android ROM

on:
  workflow_dispatch:
    inputs:
      DEVICE_NAME:
        description: Codename of the device
        required: true
      DEVICE_PATH:
        description: Path to the device tree
        required: true
        default: device/<vendor>/<device>
      KERNEL_PATH:
        description: Path to kernel source
        required: true
        default: kernel/<vendor>/<device>
      VENDOR_PATH:
        description: Path to vendor tree
        required: true
        default: vendor/<vendor>/<device>

jobs:
  build-rom:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up environment
        run: |
          sudo apt update && sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop openjdk-11-jdk pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Create workspace directory
        run: |
          mkdir -p workspace

      - name: Initialize repo
        run: |
          # Defina diretamente o branch desejado
          MANIFEST_BRANCH="17.1"
          if [[ "$MANIFEST_BRANCH" =~ ^[0-9]+\.[0-9]+$ ]]; then
            repo init --depth=1 -u https://github.com/LineageOS/android.git -b lineage-${MANIFEST_BRANCH}
          else
            echo "Invalid MANIFEST_BRANCH provided" >&2
            exit 1
          fi
        working-directory: workspace

      - name: Sync source
        run: repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        working-directory: workspace

      - name: Clone device, kernel, and vendor
        run: |
          # Defina diretamente as URLs e branches para o device tree, kernel e vendor
          DEVICE_TREE_URL="https://github.com/TeamWin/android_device_motorola_pettyl"
          KERNEL_URL="https://github.com/MotorolaMobilityLLC/kernel-msm"
          VENDOR_URL="https://github.com/AndroidBlobs/vendor_motorola_pettyl"

          DEVICE_TREE_BRANCH="android-8.1"
          KERNEL_BRANCH="android-10-release-qpzs30.30-q3-38-69-10"
          VENDOR_BRANCH="8-OPGS28.54-53-8-7-0814d-release-keys"

          # Clonar repositórios com os branches específicos
          git clone -b $DEVICE_TREE_BRANCH $DEVICE_TREE_URL workspace/${{ inputs.DEVICE_PATH }}
          git clone -b $KERNEL_BRANCH $KERNEL_URL workspace/${{ inputs.KERNEL_PATH }}
          git clone -b $VENDOR_BRANCH $VENDOR_URL workspace/${{ inputs.VENDOR_PATH }}
        working-directory: workspace

      - name: Sync ROM dependencies
        run: |
          source build/envsetup.sh
          breakfast ${{ inputs.DEVICE_NAME }}
        working-directory: workspace

      - name: Build ROM
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch lineage_${{ inputs.DEVICE_NAME }}-userdebug
          make bacon -j$(nproc --all)
        working-directory: workspace

      - name: Upload to Release
        uses: actions/upload-artifact@v3
        with:
          name: ROM-${{ inputs.DEVICE_NAME }}-${MANIFEST_BRANCH}
          path: workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
